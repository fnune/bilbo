[project]
name = "bilbo-settings"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pyyaml", "requests"]

[project.scripts]
bilbo-settings = "bilbo_settings.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
