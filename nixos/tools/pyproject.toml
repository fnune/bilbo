[project]
name = "bilbo-tools"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["anthropic", "pydantic", "pyyaml", "requests"]

[project.scripts]
bilbo-tools = "bilbo_tools.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
